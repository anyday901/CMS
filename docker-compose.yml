# Runs the app with MariaDB and Redis. See docs/install.md#docker-compose.
#
#   cp .env.example .env      # then set APP_URL, APP_KEY and DB_PASSWORD
#   docker compose up -d --build
#   docker compose exec app php artisan admin:create

x-app-environment: &app-environment
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-cms}
  DB_USERNAME: ${DB_USERNAME:-cms}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  REDIS_HOST: redis
  QUEUE_CONNECTION: redis
  LOG_CHANNEL: stderr

x-app: &app
  image: cms-app
  env_file: .env
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  restart: unless-stopped

services:
  app:
    <<: *app
    build:
      context: .
      target: app
    environment:
      <<: *app-environment
      MIGRATE_ON_START: "true"

  queue:
    <<: *app
    environment: *app-environment
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      app:
        condition: service_started

  scheduler:
    <<: *app
    environment: *app-environment
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_started

  web:
    build:
      context: .
      target: web
    image: cms-web
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-cms}
      MARIADB_USER: ${DB_USERNAME:-cms}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    restart: unless-stopped

volumes:
  storage:
  db:
  redis:
