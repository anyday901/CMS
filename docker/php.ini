; Tickets take up to 5 attachments of 10 MB each.
upload_max_filesize = 10M
post_max_size = 60M
memory_limit = 256M
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128

; Laravel handles its own sessions; these only harden PHP's native ones.
session.cookie_httponly = 1
session.cookie_secure = 1
