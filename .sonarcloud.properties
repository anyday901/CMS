# SonarCloud automatic analysis settings.
# Code style is enforced by Laravel Pint (vendor/bin/pint), so Sonar's PHP
# formatting rules, which disagree with Pint, are switched off here.
sonar.issue.ignore.multicriteria=lineLength,braces

# Lines over 120 characters (Blade views keep Tailwind classes on one line).
sonar.issue.ignore.multicriteria.lineLength.ruleKey=php:S103
sonar.issue.ignore.multicriteria.lineLength.resourceKey=**/*

# PSR-2 brace and argument alignment, which conflicts with Pint's Laravel preset.
sonar.issue.ignore.multicriteria.braces.ruleKey=php:S1808
sonar.issue.ignore.multicriteria.braces.resourceKey=**/*
